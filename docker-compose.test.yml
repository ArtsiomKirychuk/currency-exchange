services:
  postgres_test:
    image: postgres:15
    container_name: postgres_test
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 10
  app_test:
    build: .
    container_name: app_test
    env_file:
      - .env.test
    depends_on:
      postgres_test:
        condition: service_healthy
    command: sh -c "uv run alembic upgrade head && uv run pytest"
