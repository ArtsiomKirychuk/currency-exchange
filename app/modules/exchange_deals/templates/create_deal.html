<form action="/exchange-deals/" method="POST">

    <div>
        <label for="source_amount">Amount:</label>
        <input
            type="number"
            id="source_amount"
            name="source_amount"
            step="0.01"
            min="0.01"
            required
        >
    </div>

    <div>
        <label for="source_currency_id">From:</label>
        <select id="source_currency_id" name="source_currency_id" required>
            {% for currency in currencies %}
                <option value="{{ currency.currency_id }}">
                    {{ currency.currency_abbreviation }} - {{ currency.currency_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="target_currency_id">To:</label>
        <select id="target_currency_id" name="target_currency_id" required>
            {% for currency in currencies %}
                <option value="{{ currency.currency_id }}">
                    {{ currency.currency_abbreviation }} - {{ currency.currency_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit">Create deal</button>

</form>
